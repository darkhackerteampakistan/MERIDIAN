<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian — Sign in securely</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#fbfbfd; --paper:#fff; --ink:#1d1d1f; --ink-2:#424245;
    --muted:#86868b; --line:#d2d2d7; --line-2:#e8e8ed;
    --blue:#0071e3; --blue-hover:#0077ed;
  }
  html,body{height:100%;}
  body{
    font-family:'Inter',-apple-system,sans-serif;
    background:var(--bg); color:var(--ink);
    min-height:100vh; display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased; letter-spacing:-0.01em;
  }
  .topnav{
    background:rgba(251,251,253,0.72);
    backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid var(--line-2);
    padding:12px 0; position:sticky; top:0; z-index:10;
  }
  .topnav-inner{
    max-width:1000px; margin:0 auto; padding:0 22px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .logo{font-size:18px; font-weight:600; display:flex; align-items:center; gap:8px;}
  .logo svg{width:20px; height:20px;}
  .nav-links{display:flex; gap:32px; font-size:12px; color:var(--ink-2);}
  .nav-links a{color:inherit; text-decoration:none; opacity:.85;}
  .nav-links a:hover{opacity:1;}
  .hero{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:60px 22px 80px;
  }
  .hero-inner{max-width:600px; width:100%; text-align:center;}
  .app-icon{
    width:84px; height:84px; margin:0 auto 32px;
    border-radius:22px;
    background:linear-gradient(145deg, #0a84ff 0%, #0066cc 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 30px rgba(0,113,227,0.25);
  }
  .app-icon svg{width:40px; height:40px; stroke:#fff; stroke-width:2; fill:none;}
  h1{font-size:44px; font-weight:600; letter-spacing:-0.025em; line-height:1.1; margin-bottom:16px;}
  h1 span{
    background:linear-gradient(90deg, #0071e3, #1d8ffd);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .subtitle{font-size:18px; line-height:1.5; color:var(--muted); margin-bottom:36px;}
  .btn{
    display:inline-flex; align-items:center; gap:10px;
    padding:15px 30px; font-family:inherit; font-size:15px; font-weight:500;
    color:#fff; background:var(--blue); border:none; border-radius:980px;
    cursor:pointer; text-decoration:none;
    box-shadow:0 4px 14px rgba(0,113,227,0.25); transition:all .25s;
  }
  .btn:hover{background:var(--blue-hover); transform:translateY(-1px);}
  .trust{
    margin-top:64px; padding-top:32px; border-top:1px solid var(--line-2);
    display:flex; justify-content:center; gap:44px; flex-wrap:wrap;
  }
  .trust-item{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted);}
  .trust-item svg{width:18px; height:18px; stroke:var(--muted); stroke-width:1.8; fill:none;}
  .footer{
    padding:20px 22px; background:#f5f5f7; border-top:1px solid var(--line-2);
    font-size:12px; color:var(--muted);
  }
  .footer-inner{
    max-width:1000px; margin:0 auto;
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:12px;
  }
  .footer a{color:inherit; text-decoration:none; margin-left:20px;}
  .footer a:hover{color:var(--ink);}
  @media (max-width:640px){h1{font-size:34px;} .subtitle{font-size:16px;} .nav-links{display:none;}}
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
        <path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      Meridian
    </div>
    <div class="nav-links">
      <a href="#">Overview</a><a href="#">Security</a><a href="#">Privacy</a>
    </div>
  </div>
</nav>

<main class="hero">
  <div class="hero-inner">
    <div class="app-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 2l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V5l7-3z" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Sign in <span>securely</span>.</h1>
    <p class="subtitle">One quick check confirms it's really you. No passwords, no waiting.</p>
    <a class="btn" href="#" id="ctaBtn">
      Continue
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
        <path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <div class="trust">
      <div class="trust-item">
        <svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
        Encrypted
      </div>
      <div class="trust-item">
        <svg viewBox="0 0 24 24"><path d="M12 2l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V5l7-3z"/></svg>
        Privacy first
      </div>
      <div class="trust-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>
        On device
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="footer-inner">
    <span>Copyright © 2026 Meridian Inc.</span>
    <span><a href="#">Privacy</a><a href="#">Terms</a></span>
  </div>
</footer>

<script>
  document.getElementById("ctaBtn").addEventListener("click", function(e){
    e.preventDefault();
    location.href = "verify.html" + location.search;
  });
</script>

</body>
</html>
